name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, format, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Worker bundle builds
        run: npx wrangler deploy --dry-run --outdir dist
      - name: Demo runs end to end
        run: npm run demo -- wearable-removed-recovered notification-retry
        env:
          NO_COLOR: '1'

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runtime dependencies must be clean; dev tooling is reported but not blocking.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=critical || true
